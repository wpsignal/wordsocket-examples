name: Release plugins

# Builds one zip per plugin and publishes them all as assets on a single,
# rolling "latest" release. A plugin is any top-level "<slug>/<slug>.php" with
# a "Version:" header; the version is baked into the zip filename. The release
# is rebuilt on every push to main so "latest" always reflects the current tree.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a zip per plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "The latest build of each WordSocket example plugin. Upload a plugin's \`.zip\` via **Plugins → Add New → Upload Plugin**."
            echo
            echo "| Plugin | Version |"
            echo "| --- | --- |"
          } > dist/notes.md

          found=0
          for dir in */; do
            slug="${dir%/}"
            main="$slug/$slug.php"
            [ -f "$main" ] || continue

            version=$(grep -oiE 'Version:[[:space:]]*[0-9][^[:space:]]*' "$main" \
              | head -1 | grep -oE '[0-9][^[:space:]]*' || true)
            if [ -z "${version:-}" ]; then
              echo "::warning::no Version header in $main, skipping"
              continue
            fi

            # Zip the folder so it extracts to wp-content/plugins/<slug>/.
            zip -r "dist/${slug}-${version}.zip" "$slug" \
              -x "*/.git/*" "*/node_modules/*" "*/.github/*"
            echo "| \`${slug}\` | ${version} |" >> dist/notes.md
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no plugins found"
            exit 1
          fi

      - name: Publish combined "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rolling release: drop the old tag/release so "latest" always points at this build.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.zip \
            --target "${{ github.sha }}" \
            --title "WordSocket Example Plugins" \
            --notes-file dist/notes.md \
            --latest
